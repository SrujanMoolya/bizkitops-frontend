<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BizkitOps — Run your business from one app</title>
    <style>
      #app-preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #18181b 0%, #09090b 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        opacity: 1;
        transition: opacity 0.4s ease, visibility 0.4s;
        font-family: 'Sora', 'Inter', system-ui, -apple-system, sans-serif;
        color: #f4f4f5;
      }
      #app-preloader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preloader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 400px;
        width: 90%;
        text-align: center;
      }
      .logo-wrapper {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }
      .glowing-logo {
        filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.4));
        animation: logo-pulse 2s infinite ease-in-out;
      }
      .logo-text {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.05em;
        background: linear-gradient(to right, #a855f7, #6366f1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .slogan-container {
        font-size: 16px;
        color: #a1a1aa;
        height: 24px;
        margin-bottom: 40px;
        font-weight: 500;
      }
      .cursor {
        display: inline-block;
        width: 2px;
        background-color: #a855f7;
        margin-left: 2px;
        animation: blink 0.8s infinite;
      }
      .progress-container {
        width: 240px;
        height: 4px;
        background-color: #27272a;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 16px;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(to right, #a855f7, #6366f1);
        border-radius: 999px;
        box-shadow: 0 0 8px rgba(168, 85, 247, 0.5);
        animation: progress-fill 3s cubic-bezier(0.1, 0.8, 0.1, 1) forwards;
      }
      .loading-status {
        font-size: 12px;
        color: #71717a;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-weight: 600;
        animation: status-pulse 1.5s infinite ease-in-out;
      }
      @keyframes logo-pulse {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.4));
        }
        50% {
          transform: scale(1.05);
          filter: drop-shadow(0 0 24px rgba(168, 85, 247, 0.6));
        }
      }
      @keyframes blink {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }
      @keyframes progress-fill {
        0% { width: 0%; }
        15% { width: 25%; }
        40% { width: 60%; }
        70% { width: 85%; }
        100% { width: 95%; }
      }
      @keyframes status-pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app-preloader">
      <div class="preloader-content">
        <div class="logo-wrapper">
          <img
            src="/logo.png"
            alt="BizkitOps Logo"
            class="glowing-logo"
            style="width: 48px; height: 48px; object-fit: contain; border-radius: 10px;"
          />
          <div class="logo-text">BizkitOps</div>
        </div>
        <div class="slogan-container">
          <span class="typing-text"></span><span class="cursor">|</span>
        </div>
        <div class="progress-container">
          <div class="progress-bar"></div>
        </div>
        <div class="loading-status">Starting system...</div>
      </div>
      <script>
        (function() {
          const slogans = ["Make money, track money 💸", "Run your business from one app.", "All-in-one business management."];
          const slogan = slogans[Math.floor(Math.random() * slogans.length)];
          const typingTextEl = document.querySelector("#app-preloader .typing-text");
          const statusEl = document.querySelector("#app-preloader .loading-status");
          
          if (typingTextEl) {
            let index = 0;
            function type() {
              if (index < slogan.length) {
                typingTextEl.textContent += slogan.charAt(index);
                index++;
                setTimeout(type, 50);
              }
            }
            setTimeout(type, 150);
          }

          const statuses = ["Connecting database...", "Resolving user session...", "Loading assets...", "Initializing modules...", "Booting dashboard..."];
          let statusIdx = 0;
          function rotateStatus() {
            if (statusEl && statusIdx < statuses.length) {
              statusEl.textContent = statuses[statusIdx];
              statusIdx++;
              setTimeout(rotateStatus, 500);
            }
          }
          setTimeout(rotateStatus, 300);
        })();
      </script>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
